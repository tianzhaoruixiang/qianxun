# 千寻默认 Hermes 技能策略（v2026.8.3 / Nous Hermes Agent）
#
# 官方 config.yaml 只有黑名单 skills.disabled，没有 skills.enabled 白名单
#（GitHub issue #35511 仍是功能请求）。Dashboard PUT /api/skills/toggle
# 也是改这份 disabled 列表。
#
# 做法：把磁盘上已安装技能全部列入 disabled，仅保留 enabled 中的名字。
# 同时写 .no-bundled-skills，避免 hermes update / 启动同步再次灌入 bundled skills。
# 不删除 skills/ 目录（禁用即可不进系统提示词；删目录不能阻止镜像内下次 seed，除非有 marker）。

enabled:
  - llm-wiki

write_opt_out_marker: true
delete_bundled_files: false
