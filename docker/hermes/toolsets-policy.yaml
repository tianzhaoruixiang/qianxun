# 千寻默认对话网关工具集（v2026.8.3 / gateway run / 8642）
#
# 聊天网关 platform = api_server。未设置 platform_toolsets.api_server 时，
# 回退 composite hermes-api-server（约 80 个 tool schema，首轮 prompt 上万 token）。
# POST /v1/chat/completions 的客户端 tools 字段不会被该网关采用。
# Dashboard 开关默认只写 platform_toolsets.cli，必须同时写 api_server。
#
# 哨兵 no_mcp：写入 api_server 列表后不再默认挂上全部 MCP。
# known_builtin_toolsets.api_server：把已见过的内置集记为「已提供」，
# 避免新版本把 bfl 等 recently-shipped 工具再塞进已保存的短名单。
# agent.disabled_toolsets：全局扣除，覆盖所有平台解析的最后一步。
# always_disabled：即使误写入 api_server_enabled，也会从白名单剔除并写入 disabled。
#
# 8642 GET /v1/toolsets 实测原子名（不要猜）：
#   保留 web（web_search/web_extract）、delegation（delegate_task）、
#        file（patch/read_file/search_files/write_file）、
#        terminal（terminal/process 等）、code_execution（execute_code）、
#        skills（skill_view / skill_manage / skills_list；无独立「执行」函数，
#                斜杠 /{slug} → command.dispatch 另通道，不依赖本工具集）
#   禁用 memory（memory）、session_search（session_search）
# Dashboard 聊天读 platform_toolsets.cli，故 sync_cli=true，与 api_server 同白名单。
# skills 工具集（skill_view/skill_manage/skills_list）默认不开：schema 约 1.4k token，
# 斜杠 /{slug} → command.dispatch 仍可执行已启用技能；需要时在工具市场打开。

api_server_enabled:
  - web
  - file
  - terminal
  - code_execution
  - delegation

always_disabled:
  - memory
  - session_search

append_no_mcp: true
# 同步写 cli + api_server；运行期市场开关下次 up.sh / 容器启动会按本策略重置。
sync_cli: true
overwrite_existing: true

# 开启工具搜索/按需加载（MCP / 非核心插件工具 schema 按需披露）。
# 写入各 profile 的 config.yaml → tools.tool_search。
# enabled: true 会被 Hermes 归一化为 on，有 deferrable 工具时对所有 turn 强制生效。
# 内置核心工具（terminal/file/web 等）永不延后；无 MCP/插件时为 no-op。
tool_search:
  enabled: true
  # 有些版本支持更细致的策略，例如：
  # strategy: "progressive"

# 原子内置工具集（不含 hermes-* 复合集、不含 coding 等 session posture）
known_builtin_toolsets:
  - a2a
  - bfl
  - browser
  - clarify
  - code_execution
  - computer_use
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - homeassistant
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
