# 千寻 · Hermes Agent 配置（Kimi / Moonshot 中国站）
# 该文件被以只读方式挂载到容器 /opt/data/config.yaml；
# 密钥与 API server 设置通过 docker-compose `environment:` 注入。
# 参考：https://hermes-agent.nousresearch.com/docs/integrations/providers

model:
  # Hermes v0.8.x 的 provider id 是 kimi-for-coding（别名：kimi/kimi-coding/moonshot）
  # 通过 KIMI_BASE_URL 把基址切到中国站等价于「moonshot-cn」
  provider: kimi-for-coding
  default: kimi-k2.5

memory:
  memory_enabled: true
  user_profile_enabled: true

context:
  engine: compressor

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
