# 千寻 · 一键编排：TiDB + Hermes Agent (Kimi) + 千寻后端 + 千寻前端
# 入口：cd docker && ./bin/up.sh
# 关停：./bin/down.sh        # 仅关停  /  ./bin/down.sh -v 同时清理数据卷
# 验证：./bin/verify.sh
#
# 所有可调项集中在同目录 .env（参考 .env.example）
# 持久化数据目录（bind mount）：./data/
#   ├── tidb/
#   └── hermes/

name: qianxun

services:
  # ─────────────────────────────── TiDB ───────────────────────────────
  tidb:
    image: pingcap/tidb:${TIDB_TAG:-v7.5.3}
    container_name: qianxun-tidb
    command:
      - /tidb-server
      - --store=unistore
      - --path=/data/tidb
      - --host=0.0.0.0
      - --advertise-address=tidb
      - --status=10080
      - --log-level=warn
    restart: unless-stopped
    ports:
      - "${TIDB_PORT:-4000}:4000"
      - "${TIDB_STATUS_PORT:-10080}:10080"
    volumes:
      - ./data/tidb:/data/tidb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:10080/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - qianxun_net

  # ─────────────────────────── Hermes Agent ───────────────────────────
  hermes-agent:
    image: ${HERMES_IMAGES:-nousresearch/hermes-agent:latest}
    platform: linux/arm64
    container_name: qianxun-hermes-agent
    restart: unless-stopped
    command: gateway run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # OpenAI 兼容 API server（必须显式开启 + 绑定到容器 0.0.0.0）
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY:-qianxun-local-dev-key}
      - GATEWAY_ALLOW_ALL_USERS=true
      # OpenAI/Kimi 双通道统一指向 Moonshot，避免 provider 切换时路由到错误端点
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${KIMI_API_KEY:-EMPTY}}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-${KIMI_BASE_URL:-https://api.moonshot.cn/v1}}
      - OPENAI_MODEL=${OPENAI_MODEL:-${KIMI_MODEL:-kimi-k2-turbo-preview}}
      # Kimi provider（Hermes 原生支持）
      - KIMI_API_KEY=${KIMI_API_KEY:-EMPTY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_MODEL=${KIMI_MODEL:-kimi-k2-turbo-preview}
      # Tavily：Hermes 的 web_search / web_extract 等（与 ~/.hermes 文档一致，可用环境变量注入）
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    ports:
      - "${HERMES_API_PORT:-8642}:8642"
    volumes:
      - ./data/hermes:/opt/data
    shm_size: 1g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEM_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"
    networks:
      - qianxun_net

  # ──────────────────────────── 千寻后端 ────────────────────────────
  qianxun-backend:
    image: qianxun/backend:${QIANXUN_TAG:-dev}
    container_name: qianxun-backend
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: on-failure
    depends_on:
      tidb:
        condition: service_healthy
      hermes-agent:
        condition: service_started
    environment:
      # TiDB JDBC（容器内通过服务名互访）
      - TIDB_DB_URL=jdbc:mysql://tidb:4000/qianxun?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&rewriteBatchedStatements=true&allowMultiQueries=true
      - TIDB_USER=${TIDB_USER:-root}
      - TIDB_PASSWORD=${TIDB_PASSWORD:-}
      - DORIS_ENABLE=false
      # Hermes 对接
      - QIANXUN_HERMES_ENABLED=${QIANXUN_HERMES_ENABLED:-true}
      - QIANXUN_HERMES_BASE_URL=http://hermes-agent:8642/v1
      - HERMES_API_KEY=${API_SERVER_KEY:-qianxun-local-dev-key}
      - QIANXUN_HERMES_CHAT_MODEL=${QIANXUN_HERMES_CHAT_MODEL:-hermes-agent}
      - QIANXUN_HERMES_NLU_ENABLED=${QIANXUN_HERMES_NLU_ENABLED:-true}
      # 兜底 LLM（可选）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QIANXUN_LLM_BASE_URL=${QIANXUN_LLM_BASE_URL:-https://api.openai.com/v1}
      - QIANXUN_LLM_MODEL=${QIANXUN_LLM_MODEL:-gpt-4o-mini}
      - QIANXUN_LLM_MOCK=${QIANXUN_LLM_MOCK:-true}
      - QIANXUN_LLM_MAX_TOKENS=${QIANXUN_LLM_MAX_TOKENS:-16384}
      - QIANXUN_LLM_STREAM_TIMEOUT_SECONDS=${QIANXUN_LLM_STREAM_TIMEOUT_SECONDS:-3600}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
    ports:
      - "${QIANXUN_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --method=POST --header='Content-Type: application/json' --body-data='{\"jsonArg\":{},\"generalArgument\":{\"userId\":\"1\",\"loginName\":\"admin\",\"ip\":\"127.0.0.1\",\"coralKey\":\"\"}}' -qO/dev/null http://127.0.0.1:8080/QianXunService/sessions/list"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - qianxun_net

  # ──────────────────────────── 千寻前端 ────────────────────────────
  qianxun-frontend:
    image: qianxun/frontend:amd64-dev
    container_name: qianxun-frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      qianxun-backend:
        condition: service_started
    ports:
      - "${QIANXUN_FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - qianxun_net

networks:
  qianxun_net:
    name: qianxun_net
    driver: bridge
    ipam:
      config:
        # 默认网段；如与宿主网络冲突可在 .env 覆盖
        - subnet: ${DORIS_SUBNET:-172.29.80.0/24}
          ip_range: ${DORIS_IP_RANGE:-172.29.80.128/25}
          gateway: ${DORIS_GATEWAY:-172.29.80.1}
