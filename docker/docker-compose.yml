name: qianxun

services:
  tidb:
    image: pingcap/tidb:v7.5.3
    container_name: qianxun-tidb
    # 镜像 ENTRYPOINT 已是 /tidb-server。command 只能写参数，不能再写二进制名：
    # Go flag 在第一个非选项参数处停止解析，否则 --path 不生效，数据落到容器内 /tmp/tidb，
    # docker compose down / up 重建容器后库表会空。日志级别标志是 -L（没有 --log-level）。
    command:
      - -store=unistore
      - -path=/data/tidb
      - -temp-dir=/data/tidb/tmp
      - -host=0.0.0.0
      - -advertise-address=tidb
      - -status=10080
      - -L=warn
    restart: unless-stopped
    ports:
      - "${TIDB_PORT}:4000"
      - "${TIDB_STATUS_PORT}:10080"
    volumes:
      - ./data/tidb:/data/tidb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:10080/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - qianxun_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: qianxun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - qianxun_net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: qianxun-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CLAUDE_BUCKET: ${MINIO_CLAUDE_BUCKET}
      MINIO_UPLOAD_BUCKET: ${MINIO_UPLOAD_BUCKET}
      HERMES_SEED_DIR: /seed
      # 默认 0（直接 compose up 且未走 up.sh 时不要清空本地目录）。
      # ./bin/up.sh 在 HOST_S3FS=1 时会导出 CLAUDE_SEED_MIGRATE=1。
      HERMES_SEED_MIGRATE: ${CLAUDE_SEED_MIGRATE}
    volumes:
      - ./bin/minio-init.sh:/minio-init.sh:ro
      - ./data/claudecode:/seed
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks:
      - qianxun_net

  # LiteLLM：Anthropic Messages ↔ OpenAI Compatible 协议桥（方案 A）
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: qianxun-litellm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LITELLM_UPSTREAM_MODEL=${LITELLM_UPSTREAM_MODEL}
      - OPENAI_UPSTREAM_BASE_URL=${OPENAI_UPSTREAM_BASE_URL}
      - OPENAI_UPSTREAM_API_KEY=${OPENAI_UPSTREAM_API_KEY}
      - LITELLM_LOG=${LITELLM_LOG}
      # 与 config.yaml 双保险：Anthropic /v1/messages 不得转发到上游 /v1/responses
      - LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES=true
      # 默认开启：把多条/中间 system 合并到首位，避免 Qwen vLLM 400
      - LITELLM_MERGE_LEADING_SYSTEM=${LITELLM_MERGE_LEADING_SYSTEM:-true}
      - PYTHONPATH=/app
      # 内网：勿走宿主机/镜像自带代理访问容器名或内网网关
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - NO_PROXY=litellm,claude-code,qianxun-backend,minio,tidb,localhost,127.0.0.1,host.docker.internal
      - no_proxy=litellm,claude-code,qianxun-backend,minio,tidb,localhost,127.0.0.1,host.docker.internal
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
      - ../litellm/merge_leading_system.py:/app/merge_leading_system.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      # 宿主端口避免与 TiDB 的 4000 冲突；容器内仍是 4000（claude-code → http://litellm:4000）
      - "${LITELLM_PORT}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    networks:
      - qianxun_net

  claude-code:
    image: qianxun/claude-code:dev
    container_name: qianxun-claude-code
    build:
      context: ../claudecode
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    # AIO 浏览器 / VNC 需要
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${CLAUDE_CODE_PORT}
      - DATA_DIR=/opt/data
      # SDK 只认 Anthropic Messages：默认打 LiteLLM（容器内 4000），勿指向厂商 OpenAI /v1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - QIANXUN_CLAUDE_SDK_MODEL=${QIANXUN_CLAUDE_SDK_MODEL:-sonnet}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - NO_PROXY=litellm,claude-code,qianxun-backend,minio,tidb,localhost,127.0.0.1,host.docker.internal
      - no_proxy=litellm,claude-code,qianxun-backend,minio,tidb,localhost,127.0.0.1,host.docker.internal
      - CLAUDE_GATEWAY_KEY=${CLAUDE_GATEWAY_KEY}
      - CLAUDE_GATEWAY_ALLOW_INSECURE=${CLAUDE_GATEWAY_ALLOW_INSECURE:-true}
      - QIANXUN_CLAUDE_MODEL=${QIANXUN_CLAUDE_MODEL}
      - QIANXUN_CLAUDE_PERMISSION_MODE=${QIANXUN_CLAUDE_PERMISSION_MODE}
      - QIANXUN_CLAUDE_THINKING=${QIANXUN_CLAUDE_THINKING}
      # AIO 可选组件（内网可设 true 减负载；Chrome 浏览器已在镜像构建时关闭）
      - DISABLE_JUPYTER=${DISABLE_JUPYTER:-false}
      - DISABLE_CODE_SERVER=${DISABLE_CODE_SERVER:-false}
      # AIO 创建 gem 用户后再把数据盘交给它（Claude Code 不能用 root + bypassPermissions）
      - RUN_HOOK_PRE_SERVICES=mkdir -p /opt/data; chown -R gem:gem /opt/data; chmod -R a+rwX /opt/data; if [ -x /opt/gem/disable-aio-browser.sh ]; then /opt/gem/disable-aio-browser.sh; fi
    volumes:
      - ./data/claudecode:/opt/data
      - ../claudecode/disable-aio-browser.sh:/opt/gem/disable-aio-browser.sh:ro
    ports:
      - "${CLAUDE_CODE_PORT}:${CLAUDE_CODE_PORT}"
      # AIO Dashboard / VNC / Jupyter / MCP（宿主勿占用后端 8080）
      - "${AIO_SANDBOX_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${CLAUDE_CODE_PORT}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - qianxun_net

  qianxun-backend:
    image: qianxun/backend:dev
    container_name: qianxun-backend
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      tidb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      claude-code:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TIDB_DB_URL=${TIDB_DB_URL}
      - TIDB_USER=${TIDB_USER}
      - TIDB_PASSWORD=${TIDB_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_UPLOAD_BUCKET}
      - QIANXUN_FILE_PUBLIC_BASE_URL=${QIANXUN_FILE_PUBLIC_BASE_URL}
      - QIANXUN_UPLOAD_MAX_MB=${QIANXUN_UPLOAD_MAX_MB}
      - QIANXUN_CLAUDE_ENABLED=${QIANXUN_CLAUDE_ENABLED}
      - QIANXUN_CLAUDE_BASE_URL=${QIANXUN_CLAUDE_BASE_URL}
      - QIANXUN_ORCHESTRATION_BASE_URL=${QIANXUN_ORCHESTRATION_BASE_URL:-http://qianxun-backend:8080}
      - CLAUDE_GATEWAY_KEY=${CLAUDE_GATEWAY_KEY}
      - QIANXUN_CLAUDE_MODEL=${QIANXUN_CLAUDE_MODEL}
      - QIANXUN_CLAUDE_SDK_MODEL=${QIANXUN_CLAUDE_SDK_MODEL:-sonnet}
      - QIANXUN_CLAUDE_PERMISSION_MODE=${QIANXUN_CLAUDE_PERMISSION_MODE}
      - OPENAI_UPSTREAM_BASE_URL=${OPENAI_UPSTREAM_BASE_URL}
      - OPENAI_UPSTREAM_API_KEY=${OPENAI_UPSTREAM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QIANXUN_LLM_BASE_URL=${QIANXUN_LLM_BASE_URL}
      - QIANXUN_LLM_MODEL=${QIANXUN_LLM_MODEL}
      - QIANXUN_LLM_MOCK=${QIANXUN_LLM_MOCK}
      - QIANXUN_LLM_MAX_TOKENS=${QIANXUN_LLM_MAX_TOKENS}
      - QIANXUN_LLM_STREAM_TIMEOUT_SECONDS=${QIANXUN_LLM_STREAM_TIMEOUT_SECONDS}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}
      - QIANXUN_CORS_ALLOWED_ORIGIN_PATTERNS=${QIANXUN_CORS_ALLOWED_ORIGIN_PATTERNS}
    ports:
      - "${QIANXUN_BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8080/QianXunService/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - qianxun_net

  qianxun-frontend:
    image: qianxun/frontend:dev
    container_name: qianxun-frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      qianxun-backend:
        condition: service_started
    ports:
      - "${QIANXUN_FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - qianxun_net

networks:
  qianxun_net:
    name: qianxun_net
    driver: bridge
    ipam:
      config:
        - subnet: ${QIANXUN_NET_SUBNET}
          ip_range: ${QIANXUN_NET_IP_RANGE}
          gateway: ${QIANXUN_NET_GATEWAY}
