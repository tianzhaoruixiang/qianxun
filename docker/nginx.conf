server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器内只监听 80，不要把宿主机端口丢掉：用相对 Location 头，由浏览器保留原 host:port
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    client_max_body_size 50m;

    # Docker 内嵌 DNS：避免 backend 重建后 IP 变更而 nginx 仍缓存启动时解析结果
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 后端反向代理 + SSE 透传
    location /QianXunService/ {
        set $qianxun_backend http://qianxun-backend:8080;
        proxy_pass $qianxun_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 关键设置：禁缓冲、长读超时、关闭压缩
        # 读/写超时需覆盖 Hermes 整轮（含工具）；空闲断开另由后端 ~10s SSE heartbeat 防止
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
        gzip off;
        add_header X-Accel-Buffering no;
    }

    # 根路径与裸 /qianxun 统一跳转到 /qianxun/
    location = / {
        return 302 /qianxun/;
    }
    location = /qianxun {
        return 302 /qianxun/;
    }

    # SPA 前端（基路径 /qianxun/）：找不到的 path 回到 /qianxun/index.html
    location /qianxun/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /qianxun/index.html;
    }
}
