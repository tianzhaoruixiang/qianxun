[program:qianxun-claude]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",NODE_ENV="production",DATA_DIR="/opt/data",PORT="%(ENV_PORT)s",ANTHROPIC_BASE_URL="%(ENV_ANTHROPIC_BASE_URL)s",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",ANTHROPIC_AUTH_TOKEN="%(ENV_ANTHROPIC_AUTH_TOKEN)s",ANTHROPIC_MODEL="%(ENV_ANTHROPIC_MODEL)s",QIANXUN_CLAUDE_MODEL="%(ENV_QIANXUN_CLAUDE_MODEL)s",CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC="1",HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY="",http_proxy="",https_proxy="",all_proxy="",NO_PROXY="litellm,claude-code,qianxun-backend,minio,tidb,localhost,127.0.0.1,host.docker.internal",no_proxy="litellm,claude-code,qianxun-backend,minio,tidb,localhost,127.0.0.1,host.docker.internal"
command=node /app/src/server.js
directory=/app
priority=200
user=%(ENV_USER)s
autostart=true
autorestart=true
stdout_logfile=%(ENV_LOG_DIR)s/qianxun-claude.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true
