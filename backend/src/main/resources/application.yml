server:
  port: 8080

spring:
  application:
    name: qianxun-server
  servlet:
    multipart:
      max-file-size: ${QIANXUN_UPLOAD_MAX_MB:200}MB
      max-request-size: ${QIANXUN_UPLOAD_MAX_REQUEST_MB:1024}MB
  mvc:
    async:
      # 与 SseEmitter(0L) 一致：不因 MVC 异步默认超时掐断智能体长轮次
      request-timeout: 0
  datasource:
    # 保留 spring.datasource 仅作默认连接参数；实际业务走 tidbDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://tidb:4000?useSSL=false&characterEncoding=utf-8&connectTimeout=15000&socketTimeout=600000}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 16

qianxun:
  db: qianxun
  cors:
    # 内网用 IP/主机名打开前端时必填覆盖；默认 *（Bearer JWT，无 Cookie）
    allowed-origin-patterns: ${QIANXUN_CORS_ALLOWED_ORIGIN_PATTERNS:*}
  auth:
    # 生产环境务必通过环境变量覆盖 jwt-secret
    enabled: ${QIANXUN_AUTH_ENABLED:true}
    jwt-secret: ${QIANXUN_JWT_SECRET:qianxun-dev-jwt-secret-change-in-prod-min-32b}
    jwt-expiration-seconds: ${QIANXUN_JWT_EXPIRATION_SECONDS:86400}
    default-username: ${QIANXUN_AUTH_USERNAME:admin}
    default-password: ${QIANXUN_AUTH_PASSWORD:admin123}
    default-user-id: ${QIANXUN_AUTH_USER_ID:1}
    default-display-name: ${QIANXUN_AUTH_DISPLAY_NAME:管理员}
    # 以上 default-* 仅在 app_user 表尚无该用户名时写入种子管理员，不会覆盖已有密码
  llm:
    base-url: ${QIANXUN_LLM_BASE_URL:http://app-container-gateway:8642/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${QIANXUN_LLM_MODEL:gpt-4o-mini}
    # 未配置 API Key 时走本地模拟流式输出，便于开箱体验
    mock-enabled: ${QIANXUN_LLM_MOCK:true}
    # 流式补全最大 token（过小会导致回答在句中被截断）
    max-tokens: ${QIANXUN_LLM_MAX_TOKENS:16384}
    # JDK HttpClient 整段流式墙钟超时（秒）。0 = 不限制（推荐：智能体工具循环可能很长）
    stream-timeout-seconds: ${QIANXUN_LLM_STREAM_TIMEOUT_SECONDS:0}

  # 智能体运行器：独立容器中的 Claude Agent SDK 网关（HTTP NDJSON）
  claude:
    enabled: ${QIANXUN_CLAUDE_ENABLED:true}
    base-url: ${QIANXUN_CLAUDE_BASE_URL:http://claude-code:8642}
    api-key: ${CLAUDE_GATEWAY_KEY:}
    chat-model: ${QIANXUN_CLAUDE_MODEL:qwen3.6-plus}
    sdk-model: ${QIANXUN_CLAUDE_SDK_MODEL:sonnet}
    openai-upstream-base-url: ${OPENAI_UPSTREAM_BASE_URL:}
    openai-upstream-api-key: ${OPENAI_UPSTREAM_API_KEY:}
    permission-mode: ${QIANXUN_CLAUDE_PERMISSION_MODE:bypassPermissions}
    # false = 允许 MCP 工具（不再强制写入 no_mcp 哨兵）
    append-no-mcp: ${QIANXUN_CLAUDE_APPEND_NO_MCP:false}
    # Claude Code 回调本服务（从 sidecar 访问后端）
    orchestration-base-url: ${QIANXUN_ORCHESTRATION_BASE_URL:http://qianxun-backend:8080}
    # 干警等待子智能体结束的秒数，0=不限制
    orchestration-wait-seconds: ${QIANXUN_ORCHESTRATION_WAIT_SECONDS:0}

  # 旧 Hermes 运行器已停用，保留键以免残留环境变量报未知属性
  hermes:
    enabled: ${QIANXUN_HERMES_ENABLED:false}
    base-url: ${QIANXUN_HERMES_BASE_URL:}
    api-key: ${HERMES_API_KEY:}
    chat-model: ${QIANXUN_HERMES_CHAT_MODEL:}
    admin-base-url: ${QIANXUN_HERMES_ADMIN_BASE_URL:}
    dashboard-username: ${QIANXUN_HERMES_DASHBOARD_USERNAME:}
    dashboard-password: ${QIANXUN_HERMES_DASHBOARD_PASSWORD:}
    dashboard-auth-provider: ${QIANXUN_HERMES_DASHBOARD_AUTH_PROVIDER:basic}
    multiplex-profiles: ${QIANXUN_HERMES_MULTIPLEX_PROFILES:false}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:qianxun}}
    secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:qianxun-minio-dev}}
    bucket: ${MINIO_BUCKET:qianxun}
    # Claude Code 访问公开下载链接用的后端地址（容器内服务名）
    public-base-url: ${QIANXUN_FILE_PUBLIC_BASE_URL:http://qianxun-backend:8080}
    max-file-size-mb: ${QIANXUN_UPLOAD_MAX_MB:200}

management:
  health:
    elasticsearch:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      enabled: true
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: qianxun-server

springdoc:
  api-docs:
    path: /QianXunService/v3/api-docs
  swagger-ui:
    path: /QianXunService/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

tidb:
  datasource:
    DbUrl: ${TIDB_DB_URL:jdbc:mysql://tidb:4000/qianxun?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&rewriteBatchedStatements=true&allowMultiQueries=true}
    username: ${TIDB_USER:root}
    password: ${TIDB_PASSWORD:}
doris:
  datasource:
    enable: ${DORIS_ENABLE:false}
    url: ${DORIS_DB_URL:jdbc:mysql://doris-cluster:9030/test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Hongkong&cachePrepStmt=true&userServerPrepStmt=true&rewriteBatchedStatements=true}
    username: ${DORIS_USER:root}
    password: ${DORIS_PASSWORD:}

custom:
  datasource:
    maxActive: 150
    initialSize: 20
    maxWait: 6000
    minIdle: 10
    validationQuery: SELECT 1
    driverClassName: com.mysql.cj.jdbc.Driver
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000

logging:
  level:
    com.qianxun: INFO
